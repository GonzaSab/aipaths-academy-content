<svg id="dos-capas-landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="dos-capas-landscape-t dos-capas-landscape-d">
  <title id="dos-capas-landscape-t">Las dos capas: la capa de construcción y operación sostiene a la capa de ejecución</title>
  <desc id="dos-capas-landscape-d">Diagrama de dos bandas. Arriba, la capa de construcción y operación con cuatro bloques numerados: 1 Contexto, 2 Capacidades, 3 División del trabajo, 4 Disparadores y control. Una flecha ancha desciende hacia la banda inferior con los verbos construye, corrige, supervisa y recuerda. Abajo, la capa de ejecución con tres piezas sólidas — Bot de WhatsApp, Automatización n8n y Recordatorios de turno — más una cuarta caja punteada, la próxima pieza, que muestra que cada pieza nueva ya sale barata.</desc>
  <style>
    #dos-capas-landscape { color: #0f172a; --canvas: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1; --surface: #f8fafc; --arrow: #e2e8f0; --solid: #0f172a; --onSolid: #f8fafc; }
    @media (prefers-color-scheme: dark) { #dos-capas-landscape { color: #f8fafc; --canvas: #020817; --ink: #f8fafc; --muted: #94a3b8; --line: #334155; --surface: #0f172a; --arrow: #1e293b; --solid: #e2e8f0; --onSolid: #020817; } }
    :where(html.dark, .dark) #dos-capas-landscape { color: #f8fafc; --canvas: #020817; --ink: #f8fafc; --muted: #94a3b8; --line: #334155; --surface: #0f172a; --arrow: #1e293b; --solid: #e2e8f0; --onSolid: #020817; }
    :where(html.light, .light) #dos-capas-landscape { color: #0f172a; --canvas: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1; --surface: #f8fafc; --arrow: #e2e8f0; --solid: #0f172a; --onSolid: #f8fafc; }

    #dos-capas-landscape .canvas   { fill: var(--canvas); }
    #dos-capas-landscape .banda    { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
    #dos-capas-landscape .banda-b  { fill: none;          stroke: var(--line); stroke-width: 2; }
    #dos-capas-landscape .eyebrow  { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-weight: 500; letter-spacing: 0.12em; }
    #dos-capas-landscape .bloque   { fill: var(--canvas); stroke: currentColor; stroke-width: 3; }
    #dos-capas-landscape .num      { fill: currentColor; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
    #dos-capas-landscape .num-rule { stroke: currentColor; stroke-width: 4; stroke-linecap: square; }
    #dos-capas-landscape .rotulo   { fill: currentColor; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    #dos-capas-landscape .flecha   { fill: var(--arrow); }
    #dos-capas-landscape .verbos   { fill: currentColor; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-weight: 500; letter-spacing: 0.04em; }
    #dos-capas-landscape .pieza    { fill: var(--solid); }
    #dos-capas-landscape .pieza-t  { fill: var(--onSolid); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    #dos-capas-landscape .proxima  { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 14 12; stroke-linecap: round; }
    #dos-capas-landscape .proxima-t{ fill: var(--muted); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
  </style>
  <rect class="canvas" x="0" y="0" width="1600" height="900" />
  <g id="capa-construccion">
    <rect class="banda" x="48" y="44" width="1504" height="318" rx="24" />
    <text class="eyebrow" x="88" y="96" font-size="30">CAPA DE CONSTRUCCIÓN Y OPERACIÓN</text>
    <g id="bloque-1">
      <rect class="bloque" x="88" y="128" width="335" height="200" rx="16" />
      <text class="num" x="116" y="202" font-size="62">1</text>
      <line class="num-rule" x1="116" y1="224" x2="172" y2="224" />
      <text class="rotulo" x="116" y="274" font-size="38" text-anchor="start">Contexto</text>
    </g>
    <g id="bloque-2">
      <rect class="bloque" x="451" y="128" width="335" height="200" rx="16" />
      <text class="num" x="479" y="202" font-size="62">2</text>
      <line class="num-rule" x1="479" y1="224" x2="535" y2="224" />
      <text class="rotulo" x="479" y="274" font-size="38" text-anchor="start">Capacidades</text>
    </g>
    <g id="bloque-3">
      <rect class="bloque" x="814" y="128" width="335" height="200" rx="16" />
      <text class="num" x="842" y="202" font-size="62">3</text>
      <line class="num-rule" x1="842" y1="224" x2="898" y2="224" />
      <text class="rotulo" x="842" y="274" font-size="38" text-anchor="start">División del</text>
      <text class="rotulo" x="842" y="320" font-size="38" text-anchor="start">trabajo</text>
    </g>
    <g id="bloque-4">
      <rect class="bloque" x="1177" y="128" width="335" height="200" rx="16" />
      <text class="num" x="1205" y="202" font-size="62">4</text>
      <line class="num-rule" x1="1205" y1="224" x2="1261" y2="224" />
      <text class="rotulo" x="1205" y="274" font-size="38" text-anchor="start">Disparadores</text>
      <text class="rotulo" x="1205" y="320" font-size="38" text-anchor="start">y control</text>
    </g>
  </g>

  <g id="flecha-construye">
    <path class="flecha" d="M 330 378 H 1270 V 458 H 1330 L 800 534 L 270 458 H 330 Z" />
    <text class="verbos" x="800" y="430" font-size="32" text-anchor="middle">construye · corrige · supervisa · recuerda</text>
  </g>

  <g id="capa-ejecucion">
    <rect class="banda-b" x="48" y="542" width="1504" height="314" rx="24" />
    <text class="eyebrow" x="88" y="594" font-size="30">CAPA DE EJECUCIÓN · LAS PIEZAS</text>
    <g id="pieza-whatsapp">
      <rect class="pieza" x="88" y="626" width="335" height="190" rx="16" />
      <text class="pieza-t" x="255.5" y="711.24" font-size="36" text-anchor="middle">Bot de</text>
      <text class="pieza-t" x="255.5" y="755.24" font-size="36" text-anchor="middle">WhatsApp</text>
    </g>
    <g id="pieza-n8n">
      <rect class="pieza" x="451" y="626" width="335" height="190" rx="16" />
      <text class="pieza-t" x="618.5" y="711.24" font-size="36" text-anchor="middle">Automatización</text>
      <text class="pieza-t" x="618.5" y="755.24" font-size="36" text-anchor="middle">n8n</text>
    </g>
    <g id="pieza-recordatorios">
      <rect class="pieza" x="814" y="626" width="335" height="190" rx="16" />
      <text class="pieza-t" x="981.5" y="711.24" font-size="36" text-anchor="middle">Recordatorios</text>
      <text class="pieza-t" x="981.5" y="755.24" font-size="36" text-anchor="middle">de turno</text>
    </g>
    <g id="pieza-proxima">
      <rect class="proxima" x="1178.5" y="627.5" width="332" height="187" rx="16" />
      <text class="proxima-t" x="1344.5" y="711.24" font-size="36" text-anchor="middle">la próxima</text>
      <text class="proxima-t" x="1344.5" y="755.24" font-size="36" text-anchor="middle">pieza</text>
    </g>
  </g>
</svg>
