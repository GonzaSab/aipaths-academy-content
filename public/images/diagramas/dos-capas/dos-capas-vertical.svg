<svg id="dos-capas-vertical" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="dos-capas-vertical-t dos-capas-vertical-d">
  <title id="dos-capas-vertical-t">Las dos capas: la capa de construcción y operación sostiene a la capa de ejecución</title>
  <desc id="dos-capas-vertical-d">Diagrama de dos bandas. Arriba, la capa de construcción y operación con cuatro bloques numerados: 1 Contexto, 2 Capacidades, 3 División del trabajo, 4 Disparadores y control. Una flecha ancha desciende hacia la banda inferior con los verbos construye, corrige, supervisa y recuerda. Abajo, la capa de ejecución con tres piezas sólidas — Bot de WhatsApp, Automatización n8n y Recordatorios de turno — más una cuarta caja punteada, la próxima pieza, que muestra que cada pieza nueva ya sale barata.</desc>
  <style>
    #dos-capas-vertical { color: #0f172a; --canvas: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1; --surface: #f8fafc; --arrow: #e2e8f0; --solid: #0f172a; --onSolid: #f8fafc; }
    @media (prefers-color-scheme: dark) { #dos-capas-vertical { color: #f8fafc; --canvas: #020817; --ink: #f8fafc; --muted: #94a3b8; --line: #334155; --surface: #0f172a; --arrow: #1e293b; --solid: #e2e8f0; --onSolid: #020817; } }
    :where(html.dark, .dark) #dos-capas-vertical { color: #f8fafc; --canvas: #020817; --ink: #f8fafc; --muted: #94a3b8; --line: #334155; --surface: #0f172a; --arrow: #1e293b; --solid: #e2e8f0; --onSolid: #020817; }
    :where(html.light, .light) #dos-capas-vertical { color: #0f172a; --canvas: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1; --surface: #f8fafc; --arrow: #e2e8f0; --solid: #0f172a; --onSolid: #f8fafc; }

    #dos-capas-vertical .canvas   { fill: var(--canvas); }
    #dos-capas-vertical .banda    { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
    #dos-capas-vertical .banda-b  { fill: none;          stroke: var(--line); stroke-width: 2; }
    #dos-capas-vertical .eyebrow  { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-weight: 500; letter-spacing: 0.12em; }
    #dos-capas-vertical .bloque   { fill: var(--canvas); stroke: currentColor; stroke-width: 3; }
    #dos-capas-vertical .num      { fill: currentColor; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
    #dos-capas-vertical .num-rule { stroke: currentColor; stroke-width: 4; stroke-linecap: square; }
    #dos-capas-vertical .rotulo   { fill: currentColor; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    #dos-capas-vertical .flecha   { fill: var(--arrow); }
    #dos-capas-vertical .verbos   { fill: currentColor; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-weight: 500; letter-spacing: 0.04em; }
    #dos-capas-vertical .pieza    { fill: var(--solid); }
    #dos-capas-vertical .pieza-t  { fill: var(--onSolid); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
    #dos-capas-vertical .proxima  { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 14 12; stroke-linecap: round; }
    #dos-capas-vertical .proxima-t{ fill: var(--muted); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
  </style>
  <rect class="canvas" x="0" y="0" width="1080" height="1350" />
  <g id="capa-construccion">
    <rect class="banda" x="40" y="40" width="1000" height="652" rx="24" />
    <text class="eyebrow" x="76" y="96" font-size="30">CAPA DE CONSTRUCCIÓN Y OPERACIÓN</text>
    <g id="bloque-1">
      <rect class="bloque" x="76" y="132" width="928" height="120" rx="16" />
      <text class="num" x="128" y="210" font-size="54" text-anchor="middle">1</text>
      <line class="num-rule" x1="180" y1="156" x2="180" y2="228" />
      <text class="rotulo" x="212" y="206" font-size="42">Contexto</text>
    </g>
    <g id="bloque-2">
      <rect class="bloque" x="76" y="268" width="928" height="120" rx="16" />
      <text class="num" x="128" y="346" font-size="54" text-anchor="middle">2</text>
      <line class="num-rule" x1="180" y1="292" x2="180" y2="364" />
      <text class="rotulo" x="212" y="342" font-size="42">Capacidades</text>
    </g>
    <g id="bloque-3">
      <rect class="bloque" x="76" y="404" width="928" height="120" rx="16" />
      <text class="num" x="128" y="482" font-size="54" text-anchor="middle">3</text>
      <line class="num-rule" x1="180" y1="428" x2="180" y2="500" />
      <text class="rotulo" x="212" y="478" font-size="42">División del trabajo</text>
    </g>
    <g id="bloque-4">
      <rect class="bloque" x="76" y="540" width="928" height="120" rx="16" />
      <text class="num" x="128" y="618" font-size="54" text-anchor="middle">4</text>
      <line class="num-rule" x1="180" y1="564" x2="180" y2="636" />
      <text class="rotulo" x="212" y="614" font-size="42">Disparadores y control</text>
    </g>
  </g>

  <g id="flecha-construye">
    <path class="flecha" d="M 260 728 H 820 V 830 H 884 L 540 886 L 196 830 H 260 Z" />
    <text class="verbos" x="540" y="772" font-size="30" text-anchor="middle">construye · corrige</text>
      <text class="verbos" x="540" y="812" font-size="30" text-anchor="middle">supervisa · recuerda</text>
  </g>

  <g id="capa-ejecucion">
    <rect class="banda-b" x="40" y="862" width="1000" height="448" rx="24" />
    <text class="eyebrow" x="76" y="918" font-size="30">CAPA DE EJECUCIÓN · LAS PIEZAS</text>
    <g id="pieza-whatsapp">
      <rect class="pieza" x="76" y="954" width="452" height="150" rx="16" />
      <text class="pieza-t" x="302" y="1041.92" font-size="38" text-anchor="middle">Bot de WhatsApp</text>
    </g>
    <g id="pieza-n8n">
      <rect class="pieza" x="552" y="954" width="452" height="150" rx="16" />
      <text class="pieza-t" x="778" y="1041.92" font-size="38" text-anchor="middle">Automatización n8n</text>
    </g>
    <g id="pieza-recordatorios">
      <rect class="pieza" x="76" y="1128" width="452" height="150" rx="16" />
      <text class="pieza-t" x="302" y="1192.92" font-size="38" text-anchor="middle">Recordatorios</text>
      <text class="pieza-t" x="302" y="1238.92" font-size="38" text-anchor="middle">de turno</text>
    </g>
    <g id="pieza-proxima">
      <rect class="proxima" x="553.5" y="1129.5" width="449" height="147" rx="16" />
      <text class="proxima-t" x="778" y="1215.92" font-size="38" text-anchor="middle">la próxima pieza</text>
    </g>
  </g>
</svg>
